services:
  intranet:
    image: ghcr.io/eshc/eshc-intranet:main
    # build: .   # enable for dev
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - mediafiles:/app/mediafiles
    environment:
      DEBUG: "${DEBUG:-false}"
      SECRET_KEY: "${SECRET_KEY}"

      ## Database
      DB_ENGINE: "${DB_ENGINE}"
      DB_NAME: "${DB_NAME:-intranet}"
      DB_USER: "${DB_USER:-intranet}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"

      ## Email Authentication
      EMAIL_BACKEND: "${EMAIL_BACKEND}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"

      ## Email configuration
      EMAIL_DEFAULT_FROM: "${EMAIL_DEFAULT_FROM:-intranet@eshc.coop}"
      EMAIL_SERVER_EMAIL: "${EMAIL_SERVER_EMAIL:-intranet@eshc.coop}"
      EMAIL_FOR_ERROR_NOTIFICATION: "${EMAIL_FOR_ERROR_NOTIFICATION}"

      ## AWS S3
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"

      ## LDAP
      LDAP_SERVER_ADDR: "${LDAP_SERVER_ADDR}"
      LDAP_SERVER_ROOT_DN: "${LDAP_SERVER_ROOT_DN}"
      LDAP_SERVER_AUTH_USER: "${LDAP_SERVER_AUTH_USER}"
      LDAP_SERVER_AUTH_PASSWORD: "${LDAP_SERVER_AUTH_PASSWORD}"

      ## QuickBooks
      QBO_CLIENT_ID: "${QBO_CLIENT_ID}"
      QBO_CLIENT_SECRET: "${QBO_CLIENT_SECRET}"
      QBO_ENVIRONMENT: "${QBO_ENVIRONMENT:-production}"

    restart: unless-stopped
volumes:
  mediafiles:
